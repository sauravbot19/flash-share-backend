spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888" # 👈 Connects and downloads global config on startup
  reactor:
    context-propagation: AUTO

  cloud:
    gateway:
      routes:
        - id: rider-service-route
          uri: lb://rider-service
          predicates:
            - Path=/api/v1/riders/**
#          filters:
#            - name: CircuitBreaker
#              args:
#                name: riderServiceCB
#                fallbackUri: forward:/fallback/riderService

        - id: driver-service-route
          uri: lb://driver-service
          predicates:
            - Path=/api/v1/drivers/**
          filters:
            - name: CircuitBreaker
              args:
                name: driverServiceCB
                fallbackUri: forward:/fallback/driverService

management:
  tracing:
    sampling:
        probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
